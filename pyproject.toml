[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terrarium-tavern"
version = "0.6.0"
description = "Local-first roleplay agents powered by KohakuTerrarium"
license = "LicenseRef-Terrarium-Tavern-NonCommercial-1.1"
license-files = ["LICENSE/*", "vendor/mvu/LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "kohakuterrarium @ https://github.com/Kohaku-Lab/KohakuTerrarium/archive/e4fb517939ba07086481251717e888cb74dc19a4.zip",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20",
  "jieba>=0.42.1,<0.43",
  "SudachiPy>=0.6.10,<0.7",
  "SudachiDict-core>=20250129",
  "numpy>=2,<3",
  "playwright>=1.51,<2",
  "pillow>=11",
  "jsonpatch>=1.33",
  "pyyaml>=6,<7",
  "httpx>=0.27",
  "httpcore>=1.0,<2",
  "pyjwt[crypto]>=2.10,<3",
  "filelock>=3.18,<4",
  "markitdown[docx,xlsx]>=0.1.8,<0.2",
  "tiktoken>=0.12,<1",
  "google-genai>=2.31.0,<3",
]

[project.optional-dependencies]
retrieval = [
  "torch==2.11.0",
  "transformers>=4.51,<5",
  "huggingface-hub>=0.30,<1",
  "safetensors>=0.5",
  "accelerate>=1.6,<2",
  "bitsandbytes>=0.48,<1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.11",
]

[project.scripts]
tavern = "tavern.__main__:main"

[project.urls]
Upstream = "https://github.com/Kohaku-Lab/KohakuTerrarium"

[tool.hatch.build.targets.wheel]
packages = ["src/tavern"]
artifacts = ["src/tavern/static/**", "src/tavern/tokenizer_data/**", "src/tavern/skills/**"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 让测试直接使用当前工作树源码，无需预先可编辑安装项目。
pythonpath = ["src"]
# Keep only failed runs' temporary stores so passing suites do not pile up on disk.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
