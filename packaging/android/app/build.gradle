plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

def androidDev = rootProject.ext.androidDevDir
layout.buildDirectory = new File(androidDev, "build/app")

android {
    namespace "com.terrarium.tavern"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.terrarium.tavern"
        // Separate host/realm WebView storage requires setDataDirectorySuffix (API 28).
        minSdk 28
        targetSdk 35
        // Increment for each distributed APK; versionName tracks the app milestone.
        versionCode 3
        versionName "0.8.0"
        manifestPlaceholders = [appLabel: "Terrarium Tavern"]
        ndk { abiFilters "arm64-v8a" }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        dev {
            initWith debug
            applicationIdSuffix ".dev"
            manifestPlaceholders = [appLabel: "Terrarium Tavern 开发版"]
            matchingFallbacks = ["debug"]
        }
        release {
            minifyEnabled false
        }
    }
    sourceSets {
        main {
            assets.srcDir new File(androidDev, "distribution-assets")
            assets.srcDir "../../../src/tavern/static/security"
            jniLibs.srcDir new File(androidDev, "llama-jni")
        }
    }
    androidResources {
        // Keep wheel licenses under _vendor; AAPT's default <dir>_* filter drops them.
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~"
    }
    packaging {
        // Android executes the signed, installed helper from nativeLibraryDir.
        // Writable app data contains weights only, never downloaded executable code.
        jniLibs { useLegacyPackaging = true }
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
        buildPython(System.getenv("TAVERN_BUILD_PYTHON") ?: new File(androidDev, "build-env/Scripts/python.exe").absolutePath)
        extractPackages("tavern", "kohakuterrarium", "jieba", "sudachidict_core")
        pip {
            // The Android lock explicitly lists the complete dependency closure.
            // Desktop extras must not be pulled back in through upstream metadata.
            options "--no-deps", "--no-index", "--only-binary=:all:", "--find-links", new File(androidDev, "wheels").absolutePath
            install "-r", (System.getenv("TAVERN_REQUIREMENTS") ?: new File(androidDev, "requirements.txt").absolutePath)
        }
    }
    sourceSets {
        main { srcDir "../../../src" }
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.14.0"
}
